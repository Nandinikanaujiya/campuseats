<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Campus Library</h1>
    <p class="sub">Authors and their books — data served by GraphQL</p>

    <div id="list">Loading...</div>

    <form id="addForm">
      <h3>Add a book</h3>

      <input id="title" placeholder="Book title" required />

      <input id="year" type="number" placeholder="Year" style="width: 110px" />

      <select id="authorId">
        <option value="1">Asha Patel</option>
        <option value="2">Ravi Kumar</option>
      </select>

      <button type="submit">Add book</button>
    </form>

    <script>
      const API = "http://localhost:4000/";

      // Send a GraphQL request
      async function gql(query, variables) {
        const res = await fetch(API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ query, variables }),
        });

        const json = await res.json();

        if (json.errors) {
          throw new Error(json.errors[0].message);
        }

        return json.data;
      }

      // READ: fetch authors and their books
      async function load() {
        try {
          const data = await gql(`
          query {
            authors {
              id
              name
              country
              books {
                id
                title
                year
              }
            }
          }
        `);

          document.getElementById("list").innerHTML = data.authors
            .map(
              (a) => `
            <div class="author-card">
              <h2>${a.name}</h2>
              <div class="country">${a.country || ""}</div>
                          
            ${a.books
              .map(
                (b) => `
              <div class="book">
                ${b.title}
                <span class="yr">(${b.year ?? "Year unknown"})</span>
                <button onclick="deleteBook('${b.id}')">Delete</button>
              </div>
            `,
              )
              .join("")}
            </div>
          `,
            )
            .join("");
        } catch (error) {
          document.getElementById("list").textContent =
            "Could not load books: " + error.message;
        }
      }
      // deletion functionality
      
async function deleteBook(id) {
  if (!confirm('Are you sure you want to delete this book?')) {
    return;
  }

  try {
    const data = await gql(`
      mutation DeleteBook($id: ID!) {
        deleteBook(id: $id)
      }
    `, { id: String(id) });

    if (data.deleteBook) {
      alert('Book deleted successfully!');
      await load();
    } else {
      alert('Book not found.');
    }
  } catch (error) {
    alert('Could not delete book: ' + error.message);
  }
}


      // WRITE: add a book using a mutation
      document
        .getElementById("addForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const title = document.getElementById("title").value.trim();

          const yearInput = document.getElementById("year").value;

          const authorId = document.getElementById("authorId").value;

          const year = yearInput === "" ? null : Number(yearInput);

          try {
            await gql(
              `
            mutation($t: String!, $y: Int, $a: ID!) {
              addBook(title: $t, year: $y, authorId: $a) {
                id
                title
              }
            }
          `,
              {
                t: title,
                y: year,
                a: authorId,
              },
            );

            e.target.reset();
            await load();
          } catch (error) {
            alert("Could not add book: " + error.message);
          }
        });

      // Load data when the page opens
      load();
    </script>
  </body>
</html>

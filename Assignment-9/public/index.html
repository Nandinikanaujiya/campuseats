
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CampusEats Catalogue</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>CampusEats Catalogue</h1>

  <p class="sub">
    The menu — served by a REST API (Node + Express)
  </p>

  <!-- Login form -->
  <form id="loginForm">

    <h3>Login</h3>

    <input
      id="username"
      type="text"
      placeholder="Username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    >

    <button type="submit">Login</button>

  </form>

  <p id="loginMessage"></p>

  <!-- User information -->
  <div id="userInfo"></div>

  <!-- Filter vegetarian dishes -->
  <div class="filter">
    <label>
      <input type="checkbox" id="vegFilter">
      Show vegetarian dishes only
    </label>
  </div>

  <!-- Catalogue list -->
  <div id="list">
    Please login to view catalogue.
  </div>

  <!-- Add dish form -->
  <form id="addForm" style="display:none">

    <h3>Add a dish</h3>

    <input
      id="name"
      type="text"
      placeholder="Dish name"
      required
    >

    <input
      id="price"
      type="number"
      placeholder="Price (rupees)"
      min="0"
      required
    >

    <label>
      <input type="checkbox" id="veg">
      Vegetarian
    </label>

    <button type="submit">
      Add dish
    </button>

  </form>

  <script>

    // Store JWT token in memory
    let token = null;

    // Store logged-in user's role
    let currentRole = null;


    // LOGIN: POST /login

    document.getElementById('loginForm')
      .addEventListener('submit', async (e) => {

        e.preventDefault();

        const username =
          document.getElementById('username').value.trim();

        const password =
          document.getElementById('password').value;

        const message =
          document.getElementById('loginMessage');

        try {

          const res = await fetch('/login', {

            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              username,
              password
            })

          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'Login failed');
          }

          // Save JWT token
          token = data.token;

          // Decode JWT payload to read role
          const payload = JSON.parse(
            atob(token.split('.')[1])
          );

          currentRole = payload.role;

          message.textContent = 'Login successful!';

          document.getElementById('userInfo').textContent =
            'Logged in as: ' + username +
            ' | Role: ' + currentRole;

          // Show Add form only for restaurant
          document.getElementById('addForm').style.display =
            currentRole === 'restaurant' ? 'block' : 'none';

          // Load catalogue after login
          await load();

        } catch (error) {

          console.error(error);

          message.textContent =
            error.message || 'Unable to login';

        }

      });


    // READ: GET /items

    async function load() {

      const list = document.getElementById('list');

      if (!token) {
        list.textContent = 'Please login to view catalogue.';
        return;
      }

      list.textContent = 'Loading…';

      try {

        const vegFilter =
          document.getElementById('vegFilter').checked;

        const url = vegFilter
          ? '/items?veg=true'
          : '/items';

        const res = await fetch(url, {

          headers: {
            Authorization: 'Bearer ' + token
          }

        });

        if (!res.ok) {
          throw new Error('Failed to load catalogue');
        }

        const items = await res.json();

        if (items.length === 0) {

          list.textContent = 'No dishes available.';

          return;
        }

        list.innerHTML = items.map(item => `

          <div class="dish">

            <span class="name">
              ${item.name}
            </span>

            <span class="price">
              ₹${item.price}
            </span>

            <span class="veg">
              ${item.veg ? '🟢 Vegetarian' : 'Non-vegetarian'}
            </span>

            ${currentRole === 'restaurant' ? `
              <button
                class="delete"
                onclick="deleteItem(${item.id})"
              >
                Delete
              </button>
            ` : ''}

          </div>

        `).join('');

      } catch (error) {

        console.error(error);

        list.textContent =
          'Unable to load catalogue. Check login or server.';

      }

    }


    // WRITE: POST /items

    document.getElementById('addForm')
      .addEventListener('submit', async (e) => {

        e.preventDefault();

        if (currentRole !== 'restaurant') {
          alert('Only restaurant users can add dishes.');
          return;
        }

        const name =
          document.getElementById('name').value.trim();

        const price =
          Number(document.getElementById('price').value);

        const veg =
          document.getElementById('veg').checked;

        try {

          const res = await fetch('/items', {

            method: 'POST',

            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token
            },

            body: JSON.stringify({
              name,
              price,
              veg
            })

          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'Failed to add dish');
          }

          e.target.reset();

          await load();

        } catch (error) {

          console.error(error);

          alert(error.message || 'Unable to add dish.');

        }

      });


    // DELETE: DELETE /items/:id

    async function deleteItem(id) {

      if (currentRole !== 'restaurant') {
        alert('Only restaurant users can delete dishes.');
        return;
      }

      const confirmDelete =
        confirm('Are you sure you want to delete this dish?');

      if (!confirmDelete) {
        return;
      }

      try {

        const res = await fetch(`/items/${id}`, {

          method: 'DELETE',

          headers: {
            Authorization: 'Bearer ' + token
          }

        });

        if (!res.ok) {
          throw new Error('Failed to delete dish');
        }

        await load();

      } catch (error) {

        console.error(error);

        alert(error.message || 'Unable to delete dish.');

      }

    }


    // Reload catalogue when filter changes

    document.getElementById('vegFilter')
      .addEventListener('change', load);


  </script>

</body>

</html>

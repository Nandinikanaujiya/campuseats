openapi: 3.0.3
info:
  title: CampusEats Orders Microservice API
  description: >
    Assignment 6 extension of the original CampusEats Orders service.
    Adds Problem Details, stable error types, field-level validation, content negotiation,
    and Retry-After semantics while preserving Assignment 5 idempotency and payment logic.
  version: 2.1.0
servers:
  - url: http://127.0.0.1:5000
    description: Local development server
paths:
  /orders:
    post:
      summary: Create an order
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreatePayload'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URI of created resource
              schema:
                type: string
            ETag:
              schema:
                type: string
            Retry-After:
              description: Only present when a retry-safe transient failure occurs
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      summary: List orders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
            application/xml:
              schema:
                type: object
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders/{order_id}:
    get:
      summary: Fetch a single order
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Order record
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                type: object
        '304':
          description: Not Modified
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Update an order
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated order
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /orders/{order_id}/cancel:
    post:
      summary: Cancel an order
      responses:
        '200':
          description: Cancelled order
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '422':
          $ref: '#/components/responses/ValidationFailure'
components:
  responses:
    BadRequest:
      description: Request rejected for malformed JSON or syntax issues
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotAcceptable:
      description: Accept format cannot be satisfied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Unsupported request media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationFailure:
      description: One or more fields are invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Payment or dependency service unavailable
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: If-Match mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    IllegalTransition:
      description: The requested state change is impossible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: https://campuseats.internal/problems/empty-cart
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    OrderCreatePayload:
      type: object
      required: [customer_id, canteen_id, items, address]
      properties:
        customer_id:
          type: string
          format: uuid
        canteen_id:
          type: string
          format: uuid
        address:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        custom_notes:
          type: string
        delivery_fee:
          type: number
    OrderItem:
      type: object
      required: [menu_item_id, item_name, quantity, unit_price]
      properties:
        menu_item_id:
          type: string
          format: uuid
        item_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          minimum: 0
    Order:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        canteen_id:
          type: string
        status:
          type: string
        address:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_price:
          type: number
        ordered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        custom_notes:
          type: string
    OrderList:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
